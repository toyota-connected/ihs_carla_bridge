name: carla_ivi_example
description: >-
  In-shell example: drives the ihs_carla_bridge via carla_ivi and displays its
  live BridgeState. Meant to run inside the ivi-homescreen headless-vulkan shell.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  carla_ivi:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
