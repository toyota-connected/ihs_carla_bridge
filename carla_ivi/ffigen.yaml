# Regenerate bindings with:  dart run ffigen
# Binds the ihs_carla_bridge flat C ABI (bridge_c_api.h) plus the Dart event
# extension used for the BridgeState stream.
name: CarlaBridgeBindings
description: Generated FFI bindings for the ihs_carla_bridge C ABI.
output: 'lib/src/carla_ivi_bindings.g.dart'
headers:
  entry-points:
    - '../include/ihs_carla_bridge/bridge_c_api.h'
  include-directives:
    - '**bridge_c_api.h'
functions:
  include:
    - 'ihs_carla_bridge_.*'
typedefs:
  include:
    - 'IhsCarlaBridge'
preamble: |
  // GENERATED FILE — do not edit by hand. Regenerate with `dart run ffigen`.
  // ignore_for_file: always_specify_types, camel_case_types, non_constant_identifier_names, unused_field, unused_element, constant_identifier_names, lines_longer_than_80_chars
comments:
  style: any
  length: full
